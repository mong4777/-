<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 저장소</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px;line-height:1.5}
  input,textarea,button{font:inherit;padding:8px;margin:4px 0;box-sizing:border-box}
  input,textarea{width:100%}
  button{cursor:pointer}
  section{border:1px solid #8884;border-radius:8px;padding:12px;margin:16px 0}
  li{display:flex;justify-content:space-between;gap:8px;margin:6px 0;align-items:flex-start}
  .item{flex:1;white-space:pre-wrap;word-break:break-word}
  .hide{display:none}
  .err{color:#c00}
</style>
</head>
<body>
<h1>나만의 저장소</h1>
<p id="msg" class="err"></p>

<div id="app">
  <section>
    <h2>메모</h2>
    <input id="title" placeholder="제목">
    <textarea id="body" rows="4" placeholder="내용"></textarea>
    <button id="addNote">저장</button>
    <ul id="notes" style="list-style:none;padding:0"></ul>
  </section>

  <section>
    <h2>파일</h2>
    <input id="file" type="file">
    <button id="upload">업로드</button>
    <ul id="files" style="list-style:none;padding:0"></ul>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const say = m => $('msg').textContent = m || '';
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

loadNotes();
loadFiles();

async function loadNotes() {
  const { data, error } = await sb.from('notes').select('*').order('created_at', { ascending: false });
  if (error) return say(error.message);
  $('notes').innerHTML = data.map(n =>
    `<li><div class="item"><b>${esc(n.title)}</b>\n${esc(n.body)}</div><button data-id="${n.id}" class="delNote">삭제</button></li>`).join('');
  document.querySelectorAll('.delNote').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('notes').delete().eq('id', b.dataset.id);
    if (error) say(error.message); else loadNotes();
  });
}
$('addNote').onclick = async () => {
  say();
  const { error } = await sb.from('notes').insert({ title: $('title').value, body: $('body').value });
  if (error) return say(error.message);
  $('title').value = $('body').value = '';
  loadNotes();
};

async function loadFiles() {
  const { data, error } = await sb.storage.from('files').list('', { sortBy: { column: 'created_at', order: 'desc' } });
  if (error) return say(error.message);
  $('files').innerHTML = data.map(f =>
    `<li><span class="item">${esc(f.name)}</span><span><button data-n="${esc(f.name)}" class="dl">다운로드</button> <button data-n="${esc(f.name)}" class="delFile">삭제</button></span></li>`).join('');
  document.querySelectorAll('.dl').forEach(b => b.onclick = async () => {
    const { data, error } = await sb.storage.from('files').createSignedUrl(`${b.dataset.n}`, 60);
    if (error) say(error.message); else window.open(data.signedUrl, '_blank');
  });
  document.querySelectorAll('.delFile').forEach(b => b.onclick = async () => {
    const { error } = await sb.storage.from('files').remove([`${b.dataset.n}`]);
    if (error) say(error.message); else loadFiles();
  });
}
$('upload').onclick = async () => {
  say();
  const f = $('file').files[0];
  if (!f) return say('파일을 선택하세요.');
  const name = `${Date.now()}_${f.name.replace(/[^\w.\-]+/g, '_')}`;
  const { error } = await sb.storage.from('files').upload(name, f);
  if (error) return say(error.message);
  $('file').value = '';
  loadFiles();
};
</script>
</body>
</html>
